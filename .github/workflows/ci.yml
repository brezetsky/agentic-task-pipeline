name: Quality gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target api -t agent-pipeline-api:ci .
      - run: docker build --target worker -t agent-pipeline-worker:ci .
